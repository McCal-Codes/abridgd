<!doctype html><meta charset="utf-8"><title>Abridgd split</title>
<style>
:root{--bg:#0a0e13;--teal:#8abfb3;--muted:#9aa5ad;--ink:#f4f6f7}
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;
background:radial-gradient(1000px 640px at 80% 0%,#1d4144 0%,transparent 70%),linear-gradient(#0c1218,#080b0f)}
.l{position:absolute;left:110px;top:150px;width:900px}
.brand{display:flex;align-items:center;gap:20px}
.brand img{width:84px;height:84px;border-radius:20px}
.brand span{font-size:40px;font-weight:600;letter-spacing:-.01em}
h1{font-size:90px;font-weight:700;letter-spacing:-.05em;line-height:1.02;margin-top:38px}
p.sub{color:var(--muted);font-size:34px;line-height:1.5;margin-top:30px;max-width:640px}
ul{list-style:none;padding:0;margin-top:46px;font-size:29px}
li{display:flex;gap:18px;align-items:center;margin-top:22px}
li svg{flex:none}
.ph{position:absolute;width:440px;border-radius:40px;overflow:hidden;border:2px solid #2d3a45;background:#000;box-shadow:0 40px 90px #000a}
.ph img{width:100%;display:block}
.a{left:1050px;top:150px}
.b{left:1410px;top:290px;border-color:#3a5a58}
.cap{position:absolute;left:110px;bottom:42px;font-size:18px;color:#6f7a82}
</style>
<div class="l">
<div class="brand"><img src="icon.png"><span>Abridgd</span></div>
<h1>The Pittsburgh news brief that ends</h1>
<p class="sub">Free for Android. No ads, no account, no infinite scroll.</p>
<ul>
<li><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8abfb3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>One finite brief, then you are done</li>
<li><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8abfb3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Content notes before heavy stories</li>
<li><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8abfb3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Your reading stays on your phone</li>
</ul>
</div>
<div class="ph a"><img src="reader.png"></div>
<div class="ph b"><img src="home.png"></div>
<div class="cap">Abridgd 0.2.0 beta 2, Android, 11 Nov 2026. Early beta.</div>
